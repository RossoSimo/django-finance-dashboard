{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}FinanceDash{% endblock %}</title>
    <script>
        // Set theme before first paint to avoid a flash of the wrong theme.
        (function() {
            var saved = null;
            try { saved = localStorage.getItem("financedash-theme"); } catch (e) {}
            var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
<main class="fd-auth">
    <div class="auth-card fd-auth-card">
        <p class="text-center mb-3"><span class="fd-brand fs-4"><i class="bi bi-graph-up-arrow" aria-hidden="true"></i> FinanceDash</span></p>
        <div class="toast-container position-fixed top-0 end-0 p-3">
            {% for message in messages %}
            <div class="toast align-items-center border-0 text-bg-{{ message.tags|default:'info' }}"{% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %} data-bs-autohide="false" role="alert" aria-live="assertive"{% else %} role="status" aria-live="polite"{% endif %} aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">{{ message }}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
            {% endfor %}
        </div>
        {% block content %}{% endblock %}
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
