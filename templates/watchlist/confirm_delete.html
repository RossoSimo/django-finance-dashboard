{% extends "base.html" %}
{% block title %}Confirm delete - FinanceDash{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 500px;">
    <h4>Remove {{ object }} from watchlist?</h4>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, remove</button>
        <a href="{% url 'watchlist:home' %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
