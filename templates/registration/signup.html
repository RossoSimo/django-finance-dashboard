{% extends "base.html" %}
{% block title %}Sign up - FinanceDash{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 480px;">
    <h3 class="mb-3">Create an account</h3>
    <form method="post">
        {% csrf_token %}
        {% include "registration/_form_fields.html" %}
        <button type="submit" class="btn btn-primary w-100">Sign up</button>
    </form>
    <p class="mt-3 mb-0 text-center small">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
