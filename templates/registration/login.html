{% extends "base_auth.html" %}
{% block title %}Log in - FinanceDash{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm">
    <h1 class="h4 mb-3">Log in</h1>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% include "components/_form_fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    {% if signup_enabled %}
        <p class="mt-3 mb-0 text-center small">No account? <a href="{% url 'signup' %}">Sign up</a></p>
    {% endif %}
</div>
{% endblock %}
