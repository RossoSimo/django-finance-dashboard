{% comment %}icon, text, action_url/action_label, action2_url/action2_label{% endcomment %}
<div class="empty-state text-center py-5 px-3">
    <i class="bi bi-{{ icon|default:"inbox" }} display-5 text-body-secondary" aria-hidden="true"></i>
    <p class="mt-2 mb-3">{{ text }}</p>
    <div class="d-flex flex-wrap justify-content-center gap-2">
        {% if action_url %}<a class="btn btn-primary" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
        {% if action2_url %}<a class="btn btn-outline-secondary" href="{{ action2_url }}">{{ action2_label }}</a>{% endif %}
    </div>
</div>
