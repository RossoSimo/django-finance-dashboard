{% comment %}ranges=[{key,label,active}], optional holding_pk (read by charts.js as data-holding){% endcomment %}
<div class="range-scroll">
<nav aria-label="Time range" class="btn-group btn-group-sm" role="group"{% if holding_pk %} data-holding="{{ holding_pk }}"{% endif %}>
    {% for r in ranges %}<a href="?range={{ r.key }}" class="btn btn-outline-primary{% if r.active %} active{% endif %}"{% if r.active %} aria-current="page"{% endif %}>{{ r.label }}</a>{% endfor %}
</nav>
</div>
